<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>和風神社リゾート - ローポリ箱庭放置ゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
            background-color: #1a1a24;
            color: #fff;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* UI Panel Styling */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .header-panel {
            pointer-events: auto;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .resource-group {
            display: flex;
            flex-direction: column;
        }
        .resource-title {
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 1px;
        }
        .resource-val {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(212,175,55,0.6);
        }
        .cps-val {
            font-size: 12px;
            color: #a0e0a0;
            margin-top: 2px;
        }
        .btn-menu {
            pointer-events: auto;
            background: linear-gradient(135deg, #8b0000, #b22222);
            color: #fff;
            border: 1px solid #ff4500;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .bottom-panel {
            pointer-events: auto;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .shop-btn {
            background: rgba(25, 25, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            min-width: 100px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .shop-btn:hover {
            border-color: #d4af37;
            background: rgba(40, 40, 60, 0.9);
        }
        .shop-btn-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .shop-btn-cost {
            font-size: 11px;
            color: #d4af37;
        }
        /* Action Context Menu */
        #action-modal {
            position: absolute;
            display: none;
            z-index: 100;
            pointer-events: auto;
            transform: translate(-50%, -100%);
            margin-top: -15px;
        }
        .modal-box {
            background: rgba(15, 15, 25, 0.95);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .modal-btn {
            padding: 6px 14px;
            border-radius: 5px;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-move { background: #2e7d32; }
        .btn-store { background: #c62828; }

        .float-text {
            position: absolute;
            color: #ffd700;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 2px 4px #000;
            z-index: 50;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="header-panel">
            <div class="resource-group">
                <div class="resource-title">信仰ポイント</div>
                <div class="resource-val" id="point-display">0 pt</div>
                <div class="cps-val" id="cps-display">+1 pt / 秒</div>
            </div>
            <button class="btn-menu" id="upgrade-shrine-btn">本殿進化 (100 pt)</button>
        </div>

        <div class="bottom-panel">
            <div class="shop-btn" onclick="buyObject('lantern')">
                <div class="shop-btn-title">石灯籠</div>
                <div class="shop-btn-cost">50 pt</div>
            </div>
            <div class="shop-btn" onclick="buyObject('wisteria')">
                <div class="shop-btn-title">風鈴藤棚</div>
                <div class="shop-btn-cost">150 pt</div>
            </div>
            <div class="shop-btn" onclick="buyObject('tree_sakura')">
                <div class="shop-btn-title">桜の御神木</div>
                <div class="shop-btn-cost">300 pt</div>
            </div>
            <div class="shop-btn" onclick="buyObject('fox')">
                <div class="shop-btn-title">白狐</div>
                <div class="shop-btn-cost">500 pt</div>
            </div>
            <div class="shop-btn" onclick="buyObject('omikuji')">
                <div class="shop-btn-title">おみくじ掛け</div>
                <div class="shop-btn-cost">200 pt</div>
            </div>
        </div>
    </div>

    <!-- 2ボタン操作メニュー -->
    <div id="action-modal">
        <div class="modal-box">
            <button class="modal-btn btn-move" id="btn-move-action">移動</button>
            <button class="modal-btn btn-store" id="btn-store-action">片づける</button>
        </div>
    </div>

    <script>
        let points = 0;
        let cps = 1;
        let shrineLevel = 1;
        const shrineCosts = [100, 300, 800, 2000, 5000, 12000, 30000];

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a202c);
        scene.fog = new THREE.FogExp2(0x1a202c, 0.025);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;

        // --- LIGHTS ---
        scene.add(new THREE.AmbientLight(0xffeedd, 0.7));
        const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
        dirLight.position.set(15, 25, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- LOW-POLY GROUND ---
        const ground = new THREE.Mesh(
            new THREE.CylinderGeometry(14, 16, 2, 8),
            new THREE.MeshStandardMaterial({ color: 0x3a5a40, flatShading: true, roughness: 0.8 })
        );
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- MAIN SHRINE (7-STAGE LEVEL SYSTEM) ---
        let mainShrineGroup = new THREE.Group();
        scene.add(mainShrineGroup);
        mainShrineGroup.position.set(0, 0, -2);

        function createLowPolyShrine(level) {
            while(mainShrineGroup.children.length > 0) mainShrineGroup.remove(mainShrineGroup.children[0]);

            const scaleFactor = 0.8 + (level * 0.12);
            const container = new THREE.Group();

            const base = new THREE.Mesh(
                new THREE.BoxGeometry(4 * scaleFactor, 0.8 * scaleFactor, 4 * scaleFactor),
                new THREE.MeshStandardMaterial({ color: level >= 4 ? 0xb22222 : 0x5c4033, flatShading: true })
            );
            base.position.y = 0.4 * scaleFactor;
            container.add(base);

            const body = new THREE.Mesh(
                new THREE.BoxGeometry(3 * scaleFactor, 2 * scaleFactor, 2.5 * scaleFactor),
                new THREE.MeshStandardMaterial({ color: level >= 4 ? 0x8b0000 : 0x7f5539, flatShading: true })
            );
            body.position.y = (0.8 + 1) * scaleFactor;
            container.add(body);

            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(3.2 * scaleFactor, 1.8 * scaleFactor, 4),
                new THREE.MeshStandardMaterial({ color: level >= 7 ? 0xd4af37 : (level >= 5 ? 0x2d6a4f : 0x2b2d42), flatShading: true })
            );
            roof.rotation.y = Math.PI / 4;
            roof.position.y = (0.8 + 2 + 0.9) * scaleFactor;
            container.add(roof);

            container.userData = { isShrine: true };
            mainShrineGroup.add(container);
        }
        createLowPolyShrine(shrineLevel);

        // --- OBJECT PLACEMENT ---
        const placedObjects = [];
        let selectedObject = null, dragObject = null;

        function spawnObject(type, x = 0, z = 0) {
            const group = new THREE.Group();
            if (type === 'lantern') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), new THREE.MeshStandardMaterial({ color: 0x95a5a6, flatShading: true }));
                base.position.y = 0.6;
                group.add(base);
            } else if (type === 'tree_sakura') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 5), new THREE.MeshStandardMaterial({ color: 0x5c4033, flatShading: true }));
                trunk.position.y = 1.5;
                const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(1.8, 0), new THREE.MeshStandardMaterial({ color: 0xffb7c5, flatShading: true }));
                leaves.position.y = 3.5;
                group.add(trunk, leaves);
            } else if (type === 'fox') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
                body.position.y = 0.6;
                const head = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.6, 4), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }));
                head.rotation.x = -Math.PI / 3; head.position.set(0, 1.0, 0.6);
                group.add(body, head);
            }
            group.position.set(x, 0, z);
            group.userData = { id: Date.now(), type: type, isInteractable: true };
            scene.add(group);
            placedObjects.push(group);
            recalculateCPS();
        }

        spawnObject('lantern', -4, 4);
        spawnObject('tree_sakura', 5, -2);
        spawnObject('fox', 2, 3);

        function recalculateCPS() {
            let baseCps = shrineLevel;
            placedObjects.forEach(obj => {
                if (obj.userData.type === 'tree_sakura') baseCps += 5;
                if (obj.userData.type === 'fox') baseCps += 3;
            });
            cps = baseCps;
            document.getElementById('cps-display').innerText = `+${cps} pt / 秒`;
        }

        window.buyObject = function(type) {
            let cost = type === 'tree_sakura' ? 300 : (type === 'fox' ? 500 : 50);
            if (points >= cost) {
                points -= cost;
                updateUI();
                spawnObject(type, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 6 + 2);
            } else { alert('ポイントが足りません！'); }
        };

        document.getElementById('upgrade-shrine-btn').addEventListener('click', () => {
            const cost = shrineCosts[shrineLevel - 1];
            if (shrineLevel < 7 && points >= cost) {
                points -= cost;
                shrineLevel++;
                createLowPolyShrine(shrineLevel);
                recalculateCPS();
                updateUI();
            }
        });

        // --- RAYCASTING & UI CONTROL ---
        const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
        const actionModal = document.getElementById('action-modal');

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#ui-layer') || e.target.closest('#action-modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            if (dragObject) { dragObject = null; actionModal.style.display = 'none'; return; }

            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                let hitObj = intersects[0].object;
                while (hitObj.parent && hitObj.parent !== scene && !hitObj.userData.isInteractable && !hitObj.userData.isShrine) {
                    hitObj = hitObj.parent;
                }

                if (hitObj.userData.isShrine || (hitObj.parent && hitObj.parent.userData.isShrine)) {
                    points += shrineLevel;
                    showFloatText(e.clientX, e.clientY, `+${shrineLevel}`);
                    updateUI();
                } else if (hitObj.userData.isInteractable) {
                    selectedObject = hitObj;
                    actionModal.style.display = 'block';
                    actionModal.style.left = `${e.clientX}px`; actionModal.style.top = `${e.clientY}px`;
                } else { actionModal.style.display = 'none'; }
            } else { actionModal.style.display = 'none'; }
        });

        document.getElementById('btn-move-action').addEventListener('click', () => {
            if (selectedObject) { dragObject = selectedObject; actionModal.style.display = 'none'; }
        });

        document.getElementById('btn-store-action').addEventListener('click', () => {
            if (selectedObject) {
                scene.remove(selectedObject);
                placedObjects.splice(placedObjects.indexOf(selectedObject), 1);
                selectedObject = null; actionModal.style.display = 'none';
                recalculateCPS();
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (dragObject) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(ground);
                if (intersects.length > 0) {
                    dragObject.position.x = intersects[0].point.x;
                    dragObject.position.z = intersects[0].point.z;
                }
            }
        });

        function showFloatText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'float-text'; el.innerText = text;
            el.style.left = `${x}px`; el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        setInterval(() => { points += cps; updateUI(); }, 1000);

        function updateUI() {
            document.getElementById('point-display').innerText = `${points} pt`;
            const upBtn = document.getElementById('upgrade-shrine-btn');
            if (shrineLevel < 7) {
                const cost = shrineCosts[shrineLevel - 1];
                upBtn.innerText = `本殿進化 (Lv.${shrineLevel}→${shrineLevel+1}: ${cost}pt)`;
                upBtn.style.opacity = points >= cost ? '1' : '0.5';
            } else { upBtn.innerText = `本殿最高レベル (Lv.7)`; }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
